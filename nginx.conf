server {
    listen 80;
    server_name sealog-server;

    location /sealog/ {
        alias /usr/src/app/;

        # Deep routes such as /sealog/lowering_replay/<id> load the bundle and
        # runtime config relative to the route; serve them from the app root.
        rewrite ^(/[^/]+/).+/(static|config)/(.*)$ $1$2/$3 last;

        try_files $uri $uri/ /sealog/index.html;
    }
}
